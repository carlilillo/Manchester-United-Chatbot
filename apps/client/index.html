<!doctype html>
<html lang="en-GB" class="dark" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />

    <!-- Search metadata is available before JavaScript or the API loads. -->
    <title>The United Chat | Manchester United Fan Chat</title>
    <meta name="application-name" content="The United Chat" />
    <meta
      name="description"
      content="Explore Manchester United news, players, fixtures and club history with The United Chat, an independent fan chatbot grounded in the club archive."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="600x600" href="/manchester-united-crest.png" />
    <link rel="apple-touch-icon" href="/manchester-united-crest.png" />

    <!-- Open Graph previews used by Facebook, LinkedIn, WhatsApp, and other clients. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="The United Chat" />
    <meta property="og:title" content="The United Chat | Manchester United Fan Chat" />
    <meta
      property="og:description"
      content="Explore Manchester United news, players, fixtures and club history with The United Chat, an independent fan chatbot grounded in the club archive."
    />
    <meta property="og:image" content="__SOCIAL_IMAGE_URL__" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Manchester United club crest" />

    <!-- A square summary card preserves the full crest on X. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="The United Chat | Manchester United Fan Chat" />
    <meta
      name="twitter:description"
      content="Explore Manchester United news, players, fixtures and club history with The United Chat, an independent fan chatbot grounded in the club archive."
    />
    <meta name="twitter:image" content="__SOCIAL_IMAGE_URL__" />
    <meta name="twitter:image:alt" content="Manchester United club crest" />
    <!-- Vite inserts canonical and og:url tags from SITE_URL at build time. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>The United Chat — Manchester United Fan Chat</h1>
      <p>
        Explore Manchester United news, players, fixtures and club history. Enable JavaScript to use
        this independent fan chatbot.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
